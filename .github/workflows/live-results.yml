# 速報：競走成績・直前展示・水面気象（Discovery の Pages リポジトリの .github/workflows/live-results.yml に置く）
# 日本時間 7:00〜22:59、速報から当日の競走成績・直前展示・水面気象を取って live/ に置く。パソコンが切れていても動く。
# 1回の実行の中で1分おきに約55分くり返し、終わる前に次の回を自分で予約する（2026/11/21。回と回の切れ目をなくすため）
# （.github/scripts/live_loop.sh。間隔などはそちらで変える）。取る処理は .github/scripts/live_results.py と live_pre_fast.py。
# 定期実行（cron）は、つながりが切れたときと朝いちばんの起動のための予備。
name: 速報（競走成績・直前展示・水面気象）

on:
  schedule:
    - cron: "3-59/10 22,23,0-13 * * *"   # UTC。日本時間 7:03〜22:53 に10分おき（混む0分・10分ちょうどを避ける。朝は起動の遅れに備えて7時から）
  workflow_dispatch:                    # Actions の画面から手で動かす・live_loop.sh が次の回を予約する

permissions:
  contents: write
  actions: write                        # live_loop.sh が次の回を予約する（workflow_dispatch）ため

concurrency:
  group: live-results
  cancel-in-progress: false             # 動いている回が終わってから次の回（予約した回がすぐ続くので切れ目がほぼ無い）

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 1分おきに速報・直前展示を取って載せる（約55分）
        run: bash .github/scripts/live_loop.sh
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_CONF: ${{ secrets.DISCORD_CONF }}

