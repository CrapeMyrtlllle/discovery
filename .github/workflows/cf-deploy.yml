# Discovery のページを Cloudflare（Workers の静的ファイル配信）にも置く（2026/11/25）
# main に新しいページが置かれるたびに、リポジトリの中身（.git と .github を除く）をそのまま送る。
# 鍵は Settings → Secrets の CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID。
name: Cloudflare に配信

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-deploy
  cancel-in-progress: true   # 続けて置かれたときは最新だけ送る

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 送る中身をまとめる
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude .git --exclude .github --exclude .github.com ./ /tmp/site/
          echo "ファイル数: $(find /tmp/site -type f | wc -l)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare に送る
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --name discovery --compatibility-date 2026-11-25 --assets /tmp/site
