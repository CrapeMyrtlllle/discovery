<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>無料サンプル | Boat Board</title>
<style>
:root {
  color-scheme: light;
  --page: #eef3f8;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --hl: #fde2d6;          /* 回収率100%以上・最良値の強調 */
  --hl-ink: #8a2c0a;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --q1: #184f95; --q2: #3987e5; --q3: #9ec5f4;   /* 1着/2着/3着(順序) */
  --heat0: #fcfcfb; --heat1: #104281; --heatR: #a3201c;
  --b1: #ffffff; --b2: #1f1f1f; --b3: #e53935; --b4: #1e88e5; --b5: #fdd835; --b6: #43a047;
  --b1-ink: #0b0b0b; --b2-ink: #ffffff; --b3-ink: #ffffff; --b4-ink: #ffffff; --b5-ink: #0b0b0b; --b6-ink: #ffffff;
  --b-ring: rgba(11,11,11,0.35);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --accent: #3987e5; --hl: #4a2414; --hl-ink: #ffc9b0;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --q1: #9ec5f4; --q2: #3987e5; --q3: #1c5cab;
    --heat0: #1a1a19; --heat1: #6da7ec; --heatR: #e66767;
    --b2: #000000; --b-ring: rgba(255,255,255,0.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --accent: #3987e5; --hl: #4a2414; --hl-ink: #ffc9b0;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --q1: #9ec5f4; --q2: #3987e5; --q3: #1c5cab;
  --heat0: #1a1a19; --heat1: #6da7ec; --heatR: #e66767;
  --b2: #000000; --b-ring: rgba(255,255,255,0.45);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 13px;
}
button, select { font: inherit; color: inherit; }
.top {
  position: sticky; top: 0; z-index: 10; background: var(--surface);
  border-bottom: 1px solid var(--ring); padding: 8px 16px;
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
}
.top h1 { font-size: 15px; margin: 0; white-space: nowrap; }
/* ページ切替(レース/番組表/競走成績。番組表・競走成績のページと同じ見た目) */
.site-nav { display: flex; gap: 4px; padding: 8px 16px 0; background: var(--page); border-bottom: 1px solid var(--ring); }
.site-tab { padding: 8px 22px; font-size: 15px; font-weight: 700; border-radius: 8px 8px 0 0; color: var(--ink2); border: 1px solid transparent; border-bottom: 0; text-decoration: none; cursor: pointer; }
.site-tab:hover { background: var(--ring); text-decoration: none; }
.site-tab.on { background: var(--surface); color: var(--accent); border-color: var(--ring); margin-bottom: -1px; box-shadow: inset 0 3px 0 var(--accent); cursor: default; }
a.rlink { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
a.rlink:hover { color: var(--accent); }
.top .meta { color: var(--muted); font-size: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  border: 1px solid var(--ring); background: transparent; border-radius: 6px;
  padding: 4px 10px; cursor: pointer;
}
.seg button:hover { background: var(--ring); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg.races button { min-width: 38px; padding: 4px 6px; }
.spacer { flex: 1; }
.iconbtn { border: 1px solid var(--ring); background: transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.help h3 { font-size: 14px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--ring); }
.help dl { display: grid; grid-template-columns: minmax(120px, 220px) 1fr; gap: 6px 16px; margin: 0; line-height: 1.7; }
.help dt { font-weight: 700; }
.help dd { margin: 0; color: var(--ink2); }
@media (max-width: 760px) { .help dl { grid-template-columns: 1fr; gap: 0; } .help dd { margin-bottom: 8px; } }
.iconbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* 条件検索 */
.cond { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.cond select, .cond input, .srch-opt input {
  padding: 5px 6px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); font-size: 14px;
}
.cond input { width: 80px; }
.cond .unit { color: var(--ink2); min-width: 18px; }
.cond .del { border: 1px solid var(--ring); background: transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--ink2); }
.srch-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.srch-bar button { border: 1px solid var(--ring); background: transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.srch-bar button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.srch-opt { color: var(--ink2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.srch-opt input { width: 60px; }
.results tbody tr { cursor: pointer; }
.results tbody tr:hover td { background: var(--ring); }
.hitv { display: inline-flex; gap: 4px; align-items: center; margin-right: 10px; }
.count { font-weight: 700; font-size: 15px; margin: 4px 0 8px; }
/* タイムライン */
.tl-bar { grid-column: span 12; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.tl-bar select { padding: 5px 6px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); }
.tl-bar label { display: flex; gap: 4px; align-items: center; color: var(--ink2); }
.tl-grid { grid-column: span 12; display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 10px; }
@media (max-width: 760px) { .tl-grid { grid-template-columns: 1fr; } }
.tl { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.tl:hover { box-shadow: 0 0 0 2px var(--accent) inset; }
.tl.done { opacity: .45; }
.tl.next { box-shadow: 0 0 0 2px var(--accent) inset; }
.tl.hit { border-color: var(--s2); }
.tl-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.tl-h .tm { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tl-h .vr { font-weight: 800; }
.tl-h .rn { color: var(--ink2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tl-h .in { font-size: 12px; color: var(--ink2); white-space: nowrap; }
.tl-h .in b { color: var(--ink); font-size: 14px; }
.tl-h .star { color: var(--s2); font-weight: 800; }
.bell { border: 1px solid var(--ring); background: var(--surface); border-radius: 8px; font-size: 16px; line-height: 1;
  padding: 4px 6px; cursor: pointer; filter: grayscale(1); opacity: .6; flex: none; }
.bell.on { filter: none; opacity: 1; border-color: var(--s2); background: color-mix(in srgb, var(--s2) 14%, var(--surface)); }
.bell:disabled { cursor: wait; }
.nt-wrap { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.nt-box { flex-basis: 100%; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.nt-box ol { margin: 0 0 8px; padding-left: 20px; line-height: 1.9; }
.nt-box select { padding: 2px 4px; }
.nt-topic { font-size: 14px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--page); user-select: all; word-break: break-all; }
.nt-msg { margin-top: 6px; min-height: 18px; color: var(--s1); font-weight: 700; }
.linkbtn { border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; font-size: 11px; }
.tl table td, .tl table th { padding: 2px 3px; font-size: 12px; }
.tl table th { font-size: 10px; }
.tl .nm { text-align: left; font-weight: 700; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
.mslit { position: relative; width: 56px; height: 8px; background: var(--grid); border-radius: 4px; display: inline-block; vertical-align: middle; }
.mslit > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--b-ring); }
.mk { font-size: 10px; font-weight: 700; border-radius: 3px; padding: 0 3px; margin-left: 2px; background: var(--hl); color: var(--hl-ink); }

main {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 12px; padding: 12px 16px 24px; max-width: 1920px; margin: 0 auto;
}
.card {
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  padding: 12px 14px; min-width: 0;
}
.card h2 { font-size: 13px; margin: 0 0 8px; font-weight: 700; }
.card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.span-12 { grid-column: span 12; } .span-9 { grid-column: span 9; } .span-8 { grid-column: span 8; }
.span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; } .span-3 { grid-column: span 3; }
@media (max-width: 1400px) { .span-3, .span-4, .span-5, .span-7 { grid-column: span 6; } .span-8, .span-9 { grid-column: span 12; } }
@media (max-width: 900px) { main > .card { grid-column: span 12; } main { padding: 12px 16px; } }

/* ---- スマホ: 上部を縮め、パネルをタブで切り替える ---- */
#venueSel { display: none; padding: 4px 6px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); font-weight: 700; }
#tabs { display: none; }
@media (max-width: 760px) {
  .top { padding: 6px 12px; gap: 6px 8px; }
  .top h1, .top .meta, #venues, .spacer { display: none; }
  .site-nav { padding: 6px 10px 0; }
  .site-tab { padding: 7px 16px; }
  #venueSel { display: block; }
  .seg.races { flex-wrap: nowrap; overflow-x: auto; flex: 1 1 100%; order: 5; padding-bottom: 2px; scrollbar-width: none; }
  .seg.races::-webkit-scrollbar { display: none; }
  .seg.races button { flex: 0 0 auto; }
  .iconbtn { padding: 4px 8px; font-size: 12px; }
  #tabs {
    display: flex; position: sticky; top: var(--topH, 84px); z-index: 9; background: var(--page);
    padding: 6px 12px; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--ring);
  }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button {
    flex: 1 0 auto; border: 1px solid var(--ring); background: var(--surface); border-radius: 16px;
    padding: 5px 12px; font-weight: 600; cursor: pointer;
  }
  #tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { padding: 10px 12px 24px; gap: 10px; }
  main > [data-tab] { display: none; }
  main > [data-tab].on { display: block; }
  .card { padding: 10px 10px; }
  .racehead .rn { font-size: 22px; }
  main > .tiles.on { display: grid; grid-template-columns: 1fr 1fr; }
  .two svg { max-width: 300px; display: block; margin: 0 auto; }
  .tile .val { font-size: 26px; }
}

.racehead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 8px; }
.racehead .rn { font-size: 26px; font-weight: 800; }
.racehead .nm { font-size: 16px; font-weight: 700; }
.racehead .sub { color: var(--ink2); }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 6px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { font-size: 11px; font-weight: 600; color: var(--ink2); }
td.l, th.l { text-align: left; }
tbody tr { cursor: default; }
.entry tbody tr { cursor: pointer; }
.entry tbody tr:hover td { background: var(--ring); }
.entry tbody tr.focus td { box-shadow: inset 0 -2px 0 var(--accent); }
.name { font-weight: 700; letter-spacing: 0.15em; }
.best { background: var(--hl); color: var(--hl-ink); font-weight: 700; }
/* Active Point のランク */
.ap { font-weight: 700; white-space: nowrap; }
.ap-S { background: var(--hl); color: var(--hl-ink); border-radius: 3px; padding: 0 4px; }
.ap-Ap { color: var(--hl-ink); }
.ap-B, .ap-C, .ap-n { color: var(--muted); font-weight: 400; }
.ap-m { color: var(--heatR); }
.chip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 5px; font-weight: 800; font-size: 12px;
  box-shadow: inset 0 0 0 1px var(--b-ring);
}
.chip.sm { width: 18px; height: 18px; font-size: 11px; border-radius: 4px; }
.b1 { background: var(--b1); color: var(--b1-ink); } .b2 { background: var(--b2); color: var(--b2-ink); }
.b3 { background: var(--b3); color: var(--b3-ink); } .b4 { background: var(--b4); color: var(--b4-ink); }
.b5 { background: var(--b5); color: var(--b5-ink); } .b6 { background: var(--b6); color: var(--b6-ink); }
select.course { padding: 1px 2px; border: 1px solid var(--ring); border-radius: 4px; background: var(--surface); }
select.course.moved { border-color: var(--s2); color: var(--s2); font-weight: 700; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 11px; margin-top: 6px; }

.tiles { display: grid; gap: 12px; }
.tile .lab { color: var(--ink2); font-weight: 600; }
.tile .val { font-size: 34px; font-weight: 800; line-height: 1.1; }
.tile .who { color: var(--muted); font-size: 11px; }
.meter { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.meter > div { height: 100%; background: var(--accent); border-radius: 4px; }

svg text { fill: var(--ink2); font-size: 11px; font-family: inherit; }
svg .val { fill: var(--ink); font-weight: 600; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
svg .gridl { stroke: var(--grid); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink2); margin-bottom: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

.heat td.v { min-width: 46px; }
.grade-t { font-size: 14px; font-weight: 800; }
.grade { display: inline-block; min-width: 20px; padding: 0 4px; border-radius: 4px; border: 1px solid var(--ring); font-weight: 700; }
.combo td, .combo th { padding: 3px 4px; font-size: 11px; }
.combo td.hit { background: var(--hl); color: var(--hl-ink); font-weight: 700; }
.combo .cnt { color: var(--muted); }
.combo th.own { box-shadow: inset 0 -2px 0 var(--accent); }
.series td { font-size: 11px; padding: 2px 4px; }
.series .fin { font-weight: 800; font-size: 13px; }
.focusname { font-size: 18px; font-weight: 800; letter-spacing: 0.2em; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 600px) { .two { grid-template-columns: 1fr; } }

#tip {
  position: fixed; pointer-events: none; z-index: 50; display: none;
  background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
  box-shadow: 0 4px 16px rgba(0,0,0,0.18); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  max-width: 280px; white-space: pre-line;
}
</style>
</head>
<body>

<style>
/* ===== 共通サイドバー(site_nav.py) ===== */
:root { --side-w: 220px; --side-bg1: #0e1a2b; --side-bg2: #13263f; --side-ink: #c9d4e3; --side-ink2: #8193ab;
  --side-on: rgba(120,170,255,.16); --side-accent: #4c8dff; }
body { padding-left: var(--side-w); }
.sn-side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); z-index: 50; display: flex; flex-direction: column;
  background: linear-gradient(180deg, var(--side-bg1) 0%, var(--side-bg2) 100%); color: var(--side-ink);
  border-right: 1px solid rgba(255,255,255,.06); padding: 20px 14px 18px; overflow-y: auto; }
.sn-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 22px; color: #fff; }
.sn-brand .mk { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(135deg, #3d7bfd, #22b5c9); color: #fff; box-shadow: 0 4px 14px rgba(61,123,253,.35); }
.sn-brand b { display: block; font-size: 16px; letter-spacing: .06em; font-weight: 800; }
.sn-brand small { display: block; font-size: 10.5px; color: var(--side-ink2); letter-spacing: .04em; margin-top: 1px; }
.sn-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; margin: 2px 0; border-radius: 10px;
  color: var(--side-ink); text-decoration: none; font-size: 14px; font-weight: 600; position: relative;
  transition: background .15s, color .15s; }
.sn-item:hover { background: rgba(255,255,255,.06); color: #fff; text-decoration: none; }
.sn-item.on { background: var(--side-on); color: #fff; }
.sn-item.on::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0;
  background: var(--side-accent); }
.sn-item svg { flex: none; opacity: .9; }
.sn-sub { margin: 2px 0 10px 44px; display: flex; flex-direction: column; gap: 1px; }
.sn-sub button { all: unset; cursor: pointer; font-size: 12.5px; color: var(--side-ink2); padding: 6px 10px; border-radius: 8px; }
.sn-sub button:hover { color: #fff; background: rgba(255,255,255,.06); }
.sn-sub button:focus-visible, .sn-item:focus-visible { outline: 2px solid var(--side-accent); outline-offset: 1px; }
.sn-sp { flex: 1; }
.sn-foot { padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.08); }
.sn-foot p { margin: 0; font-size: 15px; line-height: 1.55; color: #fff; font-weight: 700; letter-spacing: .02em; }
.sn-foot small { display: block; margin-top: 6px; font-size: 11px; color: var(--side-ink2); line-height: 1.6; }
.sn-bar { display: none; }
.sn-badge { margin-left: auto; font-size: 9.5px; font-weight: 800; letter-spacing: .04em; padding: 2px 6px; border-radius: 99px;
  background: rgba(46,204,140,.18); color: #6fe3b2; }
.sn-badge.m { background: rgba(240,165,0,.2); color: #ffc552; }

/* ページ全体の見た目(カードを少し浮かせる・上のバーをすりガラスに) */
.card, .mcard, .tbl-wrap, .phead { border-radius: 14px !important; border-color: rgba(15,30,60,.07) !important;
  box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.06); }
:root[data-theme="dark"] .card, :root[data-theme="dark"] .mcard, :root[data-theme="dark"] .tbl-wrap, :root[data-theme="dark"] .phead {
  border-color: rgba(255,255,255,.08) !important; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.top { backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); }

/* スマホ・タブレット: サイドバーをしまい、画面下にタブバー */
@media (max-width: 960px) {
  body { padding-left: 0; padding-bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
  .sn-side { display: none; }
  .sn-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: linear-gradient(180deg, var(--side-bg1), var(--side-bg2)); border-top: 1px solid rgba(255,255,255,.08);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .sn-bar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0 3px;
    color: var(--side-ink2); text-decoration: none; font-size: 11px; font-weight: 700; border-radius: 10px; }
  .sn-bar a.on { color: #fff; background: var(--side-on); }
  .sn-bar a.on svg { color: var(--side-accent); }

function seriesStats(b) {
  const s = (R(b).series || []).filter(x => x.c);
  const avg = a => a.length ? a.reduce((p, q) => p + q, 0) / a.length : null;
  const ex = s.filter(x => x.ex), sts = s.filter(x => x.st != null && !x.stf), strk = s.filter(x => x.str);
  const last = ex[ex.length - 1];
  return {
    exAvg: avg(ex.map(x => x.ex)), exRank: avg(ex.filter(x => x.exr).map(x => x.exr)),
    lastEx: last ? last.ex : null, lastExR: last ? last.exr : null,
    stAvg: avg(sts.map(x => x.st)), stRank: avg(strk.map(x => x.str)), n: s.length,
  };
}

// ---------- 色(sequential heat) ----------
function heat(v, max, hue = 'var(--heat1)') {
  if (v == null || !max) return '';
  const t = Math.max(0, Math.min(1, v / max));
  const bg = `color-mix(in oklab, ${hue} ${Math.round(t * 85)}%, var(--heat0))`;
  const ink = t > 0.55 ? '#ffffff' : 'var(--ink)';
  return `background:${bg};color:${ink}`;
}

// ---------- Active Point ----------
const AP_CLS = { 'S': 'S', 'A+': 'Ap', 'A': 'A', 'B': 'B', 'C': 'C', '−': 'm', '新': 'n' };
function apBadge(b) {
  if (!b.apr) return '-';
  return `<span class="ap ap-${AP_CLS[b.apr] || 'B'}">${esc(b.apr)}</span>`;
}
function apTip(b) {
  if (!b.apr) return 'Active Point：データなし';
  if (b.apr === '新') return 'Active Point：新モーターで、まだ走がありません';
  const aps = b.aps || [];
  const cur = aps.length && aps[0][3] === b.reg ? 1 : 0;   // いちばん新しい節が今の選手なら「今節」
  const sets = aps.map((s, i) => `${i < cur ? '今節' : i - cur === 0 ? '前節' : `${i - cur + 1}節前`} ${s[0]} ${s[1] > 0 ? '+' : ''}${fx(s[1], 2)}（${s[2]}走）`);
  return `Active Point ${b.apr}（${b.apv > 0 ? '+' : ''}${fx(b.apv, 2)}点）\n乗った選手の普段（そのコースの着順点）との差：\n${sets.join('\n')}`;
}
function apCell(b) { return `<td data-tip="${esc(apTip(b))}">${apBadge(b)}</td>`; }

// ---------- 各パネル ----------
function panelEntry() {
  const rc = race(), v = venue();
  const ss = rc.boats.map(seriesStats);
  const minOf = arr => { const a = arr.filter(x => x != null); return a.length ? Math.min(...a) : null; };
  const maxOf = arr => { const a = arr.filter(x => x != null); return a.length ? Math.max(...a) : null; };
  const bestEx = minOf(ss.map(s => s.exAvg)), bestLast = minOf(ss.map(s => s.lastEx));
  const bestM = maxOf(rc.boats.map(b => b.midx));
  const bestRank = minOf(rc.boats.map(b => R(b).exRank));
  const rows = rc.boats.map((b, i) => {
    const r = R(b), s = ss[i], c = courseOf(b);
    const opts = [1, 2, 3, 4, 5, 6].map(k => `<option ${k === c ? 'selected' : ''}>${k}</option>`).join('');
    return `<tr data-w="${b.waku}" class="${st.focus === b.waku ? 'focus' : ''}">
      <td>${chip(b.waku)}</td>
      <td><select class="course${c !== b.waku ? ' moved' : ''}" data-w="${b.waku}" aria-label="${b.waku}号艇の進入コース">${opts}</select></td>
      <td>${esc(b.reg)}</td>
      <td class="l name"><a class="rlink" href="${SEISEKI}#r${esc(b.reg)}@${v.code}-${rc.rno}@${encodeURIComponent(v.name)}" title="競走成績でこの選手を見る">${shortName(b.name)}</a></td>
      <td>${esc(b.cls)}</td><td>${esc(b.branch)}</td><td>${esc(b.age)}</td>
      <td data-tip="${esc(fTip(r))}">${fCell(r)}</td>
      <td data-tip="${esc(fgTip(r))}">${r.fg === 2 ? '<b>◎</b>' : r.fg === 1 ? '○' : ''}</td>
      <td>${b.motor ?? '-'}</td><td>${fx(b.motor2, 1)}</td>
      <td class="${b.midx != null && b.midx === bestM ? 'best' : ''}">${fx(b.midx, 1)}</td>
      ${apCell(b)}
      <td class="${s.exAvg != null && s.exAvg === bestEx ? 'best' : ''}">${fx(s.exAvg, 2)}</td>
      <td>${fx(s.exRank, 1)}</td>
      <td class="${s.lastEx != null && s.lastEx === bestLast ? 'best' : ''}">${fx(s.lastEx, 2)}</td>
      <td>${s.lastExR ?? '-'}</td>
      <td class="${r.exRank != null && r.exRank === bestRank ? 'best' : ''}" data-tip="今節の全${v.exRankN}人中、今節平均展示タイムが早い順">${r.exRank ?? '-'}</td>
      <td data-tip="${esc(DATA.jikoLabel)}\n事故点 ${r.acc ?? 0}点 / 出走 ${r.accN ?? 0}回">${r.acc ?? '-'}</td>
      <td class="${r.accRate >= 0.7 ? 'best' : ''}" data-tip="${esc(DATA.jikoLabel)}\n事故率 = 事故点 ÷ 出走回数${r.accRate >= 0.7 ? '\n0.70以上（B2級降格の水準）' : ''}">${fx(r.accRate, 2)}</td>
      <td>${fx(b.natWin, 2)}</td><td>${fx(b.locWin, 2)}</td>
    </tr>`;
  }).join('');
  return `<section class="card span-9">
    <div class="racehead">
      <span class="rn">${esc(v.name)} ${rc.rno}R</span>
      <span class="nm">${esc(rc.name)}</span>
      <span class="sub">${esc(v.title)}</span>
      <span class="sub">${esc(v.day)} ・ ${esc(rc.dist)}m ・ 締切予定 ${esc(rc.post)}</span>
      ${bellBtn(st.v, st.r)}
    </div>
    <div class="nt-wrap" style="margin:0 0 8px">${ntBox()}</div>
    <div class="scroll"><table class="entry">
      <thead><tr><th>枠</th><th>進入</th><th>番号</th><th class="l">氏名</th><th>級</th><th>支部</th><th>年齢</th>
      <th>F</th><th>進入<br>変更FG</th><th>ﾓｰﾀｰ</th><th>ﾓｰﾀｰ<br>2連率</th><th>機力<br>指数</th><th>AP</th>
      <th>今節平均<br>展示T</th><th>今節平均<br>展示順位</th><th>前走<br>展示T</th><th>前走<br>展示順位</th><th>展示<br>ランク</th>
      <th>事故点</th><th>事故率</th><th>全国<br>勝率</th><th>当地<br>勝率</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="note">行をクリックすると選手パネルが切り替わります。「進入」を変えると、すべての集計がそのコースの値に切り替わります。強調は機力指数の最大・展示タイムの最小・展示ランクの最上位。<br>
    進入変更FG = 前付け率（2〜6枠のとき枠より内に入った割合）◎30%以上・○15%以上。事故点・事故率 = ${esc(DATA.jikoLabel)}。<br>
    AP（Active Point）= モーターが直近4節で、乗った選手を普段（そのコースでの着順点）よりどれだけ押し上げたか。S＞A+＞A＞B＞C＞−。マウスを乗せると節ごとの中身。</div>
  </section>`;
}

  return `<section class="card span-3 tiles">

// 横棒: rows=[{label(html), value, text, tip}] 共通スケール
function hbars(rows, max, opt = {}) {
  const W = 360, rowH = 26, LW = opt.labelW ?? 30, L = LW + 4, Rw = opt.right ?? 90, H = rows.length * rowH + 6;
  const sx = v => (W - L - Rw) * Math.min(1, (v || 0) / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.aria || '')}">`;
  s += `<line class="axis" x1="${L}" y1="0" x2="${L}" y2="${H}"/>`;
  rows.forEach((r, i) => {
    const y = i * rowH + 4;
    s += `<g data-tip="${esc(r.tip || '')}">`;
    s += `<rect x="0" y="${y - 2}" width="${W}" height="${rowH}" fill="transparent"/>`;
    s += `<foreignObject x="0" y="${y}" width="${LW}" height="22">${r.label}</foreignObject>`;
    if (r.segs) {
      let x = L;
      r.segs.forEach((g, j) => {
        const w = sx(g.v); if (w <= 0) return;
        const last = j === r.segs.length - 1;
        s += `<rect x="${x}" y="${y + 3}" width="${Math.max(0, w - 2)}" height="16" rx="${last ? 4 : 0}" fill="${g.c}"/>`;
        x += w;
      });
    } else {
      s += `<rect x="${L}" y="${y + 3}" width="${Math.max(0, sx(r.value) - 1)}" height="16" rx="4" fill="${r.color || 'var(--accent)'}"/>`;
    }
    s += `<text class="val" x="${W - Rw + 6}" y="${y + 15}">${esc(r.text)}</text></g>`;
  });
  return s + '</svg>';
}
// スリット表示: STが早い(小さい)ほど右へ伸びる。右端の点線 = スタートライン(ST 0.00)
const SLIT_MAX = 0.35;
function slitBars(rows, aria) {
  const W = 360, rowH = 30, L = 34, Rw = 92, H = rows.length * rowH + 18;
  const line = W - Rw;                       // スタートライン(ST 0.00)の位置
  const len = st => (line - L) * Math.max(0, Math.min(1, (SLIT_MAX - st) / SLIT_MAX));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(aria)}">`;
  [0.30, 0.20, 0.10].forEach(t => {
    const xx = L + (line - L) * (1 - t / SLIT_MAX);
    s += `<line class="gridl" x1="${xx}" x2="${xx}" y1="0" y2="${H - 14}"/><text x="${xx}" y="${H - 2}" text-anchor="middle">${t.toFixed(2)}</text>`;
  });
  s += `<line x1="${line}" x2="${line}" y1="0" y2="${H - 14}" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  s += `<text x="${line}" y="${H - 2}" text-anchor="middle" class="val">0.00</text>`;
  rows.forEach((r, i) => {
    const y = i * rowH + 4;
    s += `<g data-tip="${esc(r.tip || '')}"><rect x="0" y="${y - 2}" width="${W}" height="${rowH}" fill="transparent"/>`;
    s += `<foreignObject x="0" y="${y + 2}" width="30" height="24">${r.label}</foreignObject>`;
    if (r.st != null) {
      const w = len(r.st);
      s += `<rect x="${L}" y="${y + 6}" width="${Math.max(0, w)}" height="16" rx="4" fill="var(--b${r.waku})" stroke="var(--b-ring)" stroke-width="1"/>`;
    }
    s += `<text class="val" x="${line + 8}" y="${y + 19}">${esc(r.text)}</text></g>`;
  });
  return s + '</svg>';
}

const boatLabel = b => `<div xmlns="http://www.w3.org/1999/xhtml">${chip(b.waku)}</div>`;

function panelTech() {
  const boats = race().boats, W = 360, H = 170, top = 18, base = 140, AX = 32, gw = (W - AX) / 6;
  const keys = [['差し', '差され', 'var(--s1)'], ['まくり', '捲られ', 'var(--s2)'], ['まくり差し', '捲差され', 'var(--s3)']];
  const max = Math.max(0.2, ...boats.flatMap(b => (C(b) ? C(b).tech.slice(1) : [0])));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="決まり手">`;
  [0.25, 0.5, 0.75, 1].forEach(t => { const y = base - (base - top) * t;
    s += `<line class="gridl" x1="${AX}" x2="${W}" y1="${y}" y2="${y}"/><text x="${AX - 4}" y="${y + 4}" text-anchor="end">${pct(max * t, 0)}</text>`; });
  s += `<line class="axis" x1="${AX}" x2="${W}" y1="${base}" y2="${base}"/>`;
  boats.forEach((b, i) => {
    const c = C(b), x0 = AX + i * gw + 10, bw = (gw - 20) / 3, inner = courseOf(b) === 1;
    keys.forEach(([k, k1, col], j) => {
      const v = c ? c.tech[j + 1] : 0, h = (base - top) * Math.min(1, v / max);
      const x = x0 + j * bw;
      s += `<g data-tip="${esc(shortName(b.name))}（${courseOf(b)}コース）\n${inner ? k1 : k} ${pct(v)}">
        <rect x="${x}" y="${top}" width="${bw}" height="${base - top}" fill="transparent"/>
        <rect x="${x + 1}" y="${base - h}" width="${Math.max(0, bw - 2)}" height="${h}" rx="3" fill="${col}"/>
        ${v >= max * 0.5 ? `<text class="val" x="${x + bw / 2}" y="${base - h - 3}" text-anchor="middle" font-size="9">${(v * 100).toFixed(0)}</text>` : ''}</g>`;
    });
    s += `<foreignObject x="${AX + i * gw + gw / 2 - 11}" y="${base + 5}" width="24" height="24">${boatLabel(b)}</foreignObject>`;
  });
  s += '</svg>';
  const tbl = boats.map(b => { const c = C(b), inner = courseOf(b) === 1;
    return `<tr><td>${chip(b.waku)}</td><td class="l name">${shortName(b.name)}</td><td class="muted">${courseOf(b)}${inner ? '<small>（され）</small>' : ''}</td>` +
      [1, 2, 3].map(j => `<td class="v">${c ? pct(c.tech[j], 0) : '-'}</td>`).join('') + `<td class="muted">${c ? c.n : 0}</td></tr>`; }).join('');
  return `<section class="card span-4"><h2>決まり手分析<small>出走数に対する割合</small></h2>
    <div class="legend"><span><i style="background:var(--s1)"></i>差し</span><span><i style="background:var(--s2)"></i>まくり</span><span><i style="background:var(--s3)"></i>まくり差し</span><span class="muted">1コースの艇は「され」た割合</span></div>
    ${s}
    <table class="heat"><thead><tr><th>枠</th><th class="l">選手</th><th>進入</th><th>差し</th><th>まくり</th><th>まくり差し</th><th>走</th></tr></thead><tbody>${tbl}</tbody></table>
    <div class="note">例：差し 15% ＝ そのコースで出た100走のうち15走は差しで1着。1コースの行は、差された・捲られた・捲り差された割合。</div></section>`;
}

function panelFocus() {
  const b = race().boats.find(x => x.waku === st.focus) || race().boats[0];
  const c = C(b), co = courseOf(b);
  let donut = '<div class="muted">データなし</div>', bars = '';
  if (c) {
    const vals = c.s1.map((v, i) => ({ w: i + 2, v }));
    const tot = vals.reduce((p, q) => p + q.v, 0) || 1;
    let a = -Math.PI / 2, s = `<svg viewBox="0 0 220 170" width="100%" role="img" aria-label="1号艇1着時の2着">`;
    const cx = 80, cy = 85, r0 = 70, r1 = 40;
    vals.forEach(o => {
      if (!o.v) return;
      const a2 = a + 2 * Math.PI * o.v / tot, big = a2 - a > Math.PI ? 1 : 0;
      const p = (ang, r) => `${cx + r * Math.cos(ang)},${cy + r * Math.sin(ang)}`;
      s += `<path data-tip="1号艇1着時の2着 ${o.w}号艇\n${pct(o.v)}（${c.c1w}回中）" d="M${p(a, r0)} A${r0},${r0} 0 ${big} 1 ${p(a2, r0)} L${p(a2, r1)} A${r1},${r1} 0 ${big} 0 ${p(a, r1)}Z" fill="var(--b${o.w})" stroke="var(--surface)" stroke-width="2"/>`;
      a = a2;
    });
    s += `<text class="val" x="${cx}" y="${cy + 4}" text-anchor="middle">${c.c1w}回</text>`;
    vals.forEach((o, i) => {
      s += `<foreignObject x="160" y="${14 + i * 28}" width="20" height="20"><div xmlns="http://www.w3.org/1999/xhtml">${chip(o.w, 1)}</div></foreignObject>
        <text class="val" x="184" y="${28 + i * 28}">${pct(o.v, 0)}</text>`;
    });
    donut = s + '</svg>';
    const rows = c.t3w.map((v, i) => ({
      label: boatLabel({ waku: i + 1 }), value: v, color: i + 1 === b.waku ? 'var(--muted)' : 'var(--accent)',
      text: pct(v, 0) + (i + 1 === b.waku ? ' 本人' : ''),
      tip: `この選手が${co}コースのとき\n${i + 1}号艇の3連対率 ${pct(v)}`,
    }));
    bars = hbars(rows, 1, { aria: '他艇の3連対率', right: 70 });
  }
  return `<section class="card span-4">
    <h2>選手パネル<small>出走表の行をクリックで切替</small></h2>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">${chip(b.waku)}
      <span class="focusname">${shortName(b.name)}</span><span class="sub">${co}コース ・ ${c ? c.n : 0}走</span></div>
    <div class="two">
      <div><div class="muted" style="font-size:11px">1号艇が1着のときの2着</div>${donut}</div>
      <div><div class="muted" style="font-size:11px">同レースの各艇の3連対率</div>${bars}</div>
    </div></section>`;
}

function heatTable(title, sub, cols, rowVals, max, note, ownCol, span = 6) {
  const head = cols.map((c, j) => `<th>${c}</th>`).join('');
  const body = race().boats.map(b => {
    const vals = rowVals(b);
    return `<tr><td>${chip(b.waku)}</td><td class="l name">${shortName(b.name)}</td><td class="muted">${courseOf(b)}</td>` +
      cols.map((c, j) => {
        const v = vals ? vals[j] : null;
        const own = ownCol && ownCol(b) === j;
        return `<td class="v" style="${heat(v, max)}${own ? ';box-shadow:inset 0 0 0 2px var(--accent)' : ''}" data-tip="${esc(shortName(b.name))}（${courseOf(b)}コース）\n${c}: ${pct(v)}">${pct(v, 0)}</td>`;
      }).join('') + '</tr>';
  }).join('');
  return `<section class="card span-${span}"><h2>${title}<small>${sub}</small></h2>
    <div class="scroll"><table class="heat"><thead><tr><th>枠</th><th class="l">選手</th><th>進入</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
    ${note ? `<div class="note">${note}</div>` : ''}</section>`;
}

// 折れ線: xs=[{label(html)}], series=[{w(艇番の色), name, vals[], tips[]}]
function lineChart(xs, series, max, aria) {
  const W = 560, H = 230, L = 40, Rr = 14, top = 12, base = 186;
  const sx = i => L + (W - L - Rr) * (xs.length === 1 ? 0.5 : i / (xs.length - 1));
  const sy = v => base - (base - top) * Math.min(1, (v || 0) / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(aria)}">`;
  for (let k = 1; k <= 4; k++) {
    const v = max * k / 4, y = sy(v);
    s += `<line class="gridl" x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
  }
  s += `<line class="axis" x1="${L}" x2="${W - Rr}" y1="${base}" y2="${base}"/><text x="${L - 6}" y="${base + 4}" text-anchor="end">0%</text>`;
  xs.forEach((x, i) => { s += `<foreignObject x="${sx(i) - 20}" y="${base + 8}" width="40" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center">${x.label}</div></foreignObject>`; });
  series.forEach(se => {
    const pts = se.vals.map((v, i) => v == null ? null : [sx(i), sy(v)]);
    const d = pts.reduce((acc, p, i) => p ? acc + `${acc && pts[i - 1] ? 'L' : 'M'}${p[0]},${p[1]}` : acc, '');
    // 白・黄の線も見えるよう、下に細い縁取りの線を敷く
    s += `<path d="${d}" fill="none" stroke="var(--b-ring)" stroke-width="4" stroke-linejoin="round"/>`;
    s += `<path d="${d}" fill="none" stroke="var(--b${se.w})" stroke-width="2.5" stroke-linejoin="round"/>`;
  });
  series.forEach(se => se.vals.forEach((v, i) => {
    if (v == null) return;
    s += `<g data-tip="${esc(se.tips[i])}"><circle cx="${sx(i)}" cy="${sy(v)}" r="11" fill="transparent"/>
      <circle cx="${sx(i)}" cy="${sy(v)}" r="4.5" fill="var(--b${se.w})" stroke="var(--b-ring)" stroke-width="1.2"/></g>`;
  }));
  return s + '</svg>';
}
const lineLegend = items => `<div class="legend">${items.map(([w, t]) => `<span>${chip(w, 1)} ${t}</span>`).join('')}</div>`;

function panelSecond() {
  const boats = race().boats;
  const xs = boats.map(b => ({ label: chip(b.waku) }));
  const series = [2, 3, 4, 5, 6].map((k, j) => ({
    w: k,
    vals: boats.map(b => C(b) ? C(b).s1[j] : null),
    tips: boats.map(b => C(b) ? `${shortName(b.name)}（${courseOf(b)}コース）がいたレース\n1号艇1着 ${C(b).c1w}回のうち 2着が${k}号艇: ${pct(C(b).s1[j])}` : ''),
  }));
  const max = Math.max(0.4, ...series.flatMap(s => s.vals.filter(v => v != null))) ;
  // 例: 2号艇以降で、いちばん高い点を1つ取り上げて読み方を書く
  let ex = null;
  boats.forEach(b => { const c = C(b); if (!c || b.waku === 1) return;
    c.s1.forEach((v, j) => { if (v != null && (!ex || v > ex.v)) ex = { b, k: j + 2, v, n: c.c1w }; }); });
  const exText = ex ? `例：${ex.b.waku}号艇（${shortName(ex.b.name)}・${courseOf(ex.b)}コース）の上にある「1-${ex.k}」の点が ${pct(ex.v, 0)} ＝ この選手がこのコースにいたレースで1号艇が1着になった ${ex.n}回のうち、2着が${ex.k}号艇だったのが ${pct(ex.v, 0)}。` : '';
  return `<section class="card span-6"><h2>逃げ・逃がし時の2着傾向<small>1号艇が1着のときの2着の艇番</small></h2>
    ${lineLegend([2, 3, 4, 5, 6].map(k => [k, `1-${k}`]))}
    ${lineChart(xs, series, Math.ceil(max * 10) / 10, '逃げ・逃がし時の2着傾向')}
    <div class="note">横軸 = 各艇（その選手がそのコースにいたレース）。線 = 1号艇が1着のとき、2着がその艇番だった割合（各艇で合計100%）。${exText}</div></section>`;
}

function panelSeries() {
  const days = venue().seriesDays;
  if (!days.length) return `<section class="card span-7"><h2>節間成績</h2><div class="muted">今節のこの日より前の成績はありません（初日）。</div></section>`;

    const s = R(b).series || [];

      const rs = s.filter(x => x.d === d).slice(0, 2);
      const one = x => x ? `<td data-tip="${x.r}R ${x.w}号艇・${x.c ?? '-'}コース\n着順 ${x.f}\nST ${x.st == null ? '-' : (x.stf ? 'F' : '') + fx(x.st, 2)}\n展示 ${fx(x.ex, 2)}（${x.exr ?? '-'}位）">
        ${chip(x.w, 1)}<div class="fin">${x.f.replace(/^0/, '')}</div><div class="muted">${x.st == null ? '' : (x.stf ? 'F' : '') + fx(x.st, 2).replace(/^0/, '')}</div></td>` : '<td></td>';
      return one(rs[0]) + one(rs[1]);

      ${g.racers.map(r => `<div data-tip="${esc(g.title)}\n${esc(r.name)}（${r.reg}）\n${r.n}走 1着${r.w}回 2連対率 ${pct(r.n ? r.t2 / r.n : null, 0)}\n平均展示 ${fx(r.ex, 2)} ／ 平均ST ${fx(r.st, 2)}">

        <div class="muted" style="font-size:11px">2連 ${pct(r.n ? r.t2 / r.n : null, 0)}・展示 ${fx(r.ex, 2)}・ST ${r.st == null ? '-' : fx(r.st, 2).replace(/^0/, '')}</div></div>`).join('')}
    </td>`;
  };

    <div class="note">各節の選手名にマウスを乗せると成績の詳細。モーターの入れ替え（年1回の新モーター導入）より前の節は、同じ番号でも別のモーターです。</div></section>`;

function panelCombo() {
  const cs = DATA.combos;

    const c = C(b);
    return `<tr><td>${chip(b.waku)}</td><td class="l name">${shortName(b.name)}</td><td class="muted">${courseOf(b)}</td><td class="muted">${c ? c.n : 0}</td>` +
      cs.map((k, j) => {
        if (!c) return '<td>-</td>';

        return `<td class="${r >= 1 && n > 0 ? 'hit' : ''}" data-tip="${esc(shortName(b.name))}（${courseOf(b)}コース ${c.n}走）\n2連単 ${k}\n出現 ${n}回（${pct(n / c.n)}）\n回収率 ${pct(r, 0)}">

    <div class="note">（ ）は出現回数、% は毎回100円買ったときの回収率。回収率100%以上を強調。出現回数が少ない組番は偶然の影響が大きいので注意。</div></section>`;
}

// ---------- 条件検索 ----------
// 指標: key, 表示名, 単位('%'=率 / 's'=秒 / ''=そのまま), 取り出し(b=艇, c=その艇の枠なりコースの集計, r=選手)
const METRICS = [
  ['w', '1着率', '%', (b, c) => c && c.w],
  ['t2', '2連対率', '%', (b, c) => c && c.t2],
  ['t3', '3連対率', '%', (b, c) => c && c.t3],
  ['nige', '逃げ率（1号艇）/逃がし率', '%', (b, c) => c && c.tech[0]],
  ['sashi', '差し率（1号艇は差され率）', '%', (b, c) => c && c.tech[1]],
  ['makuri', 'まくり率（1号艇は捲られ率）', '%', (b, c) => c && c.tech[2]],
  ['makusa', 'まくり差し率（1号艇は捲差され率）', '%', (b, c) => c && c.tech[3]],
  ['st', '平均ST', 's', (b, c) => c && c.st],
  ['str', '平均ST順位', '', (b, c) => c && c.str],
  ['st1', 'ST順位1位率', '%', (b, c) => c && c.st1],
  ['st4', 'ST順位4位以下率', '%', (b, c) => c && c.st4],
  ['nbL', '左着外率', '%', (b, c) => c && c.nbL],
  ['nbR', '右着外率', '%', (b, c) => c && c.nbR],
  ['fNow', '今期F回数', '回', (b, c, r) => fNow(r)],
  ['fHid', '隠F（あり=1）', '', (b, c, r) => fHid(r)],
  ['fAny', 'F持ち（今期F＋隠F）', '回', (b, c, r) => fNow(r) + fHid(r)],
  ['midx', '機力指数', '', b => b.midx],
  ['apv', 'Active Point（点）', '', b => b.apv],
  ['motor2', 'モーター2連率', '', b => b.motor2],
  ['exRank', '展示ランク（今節）', '', (b, c, r) => r.exRank],
  ['accRate', '事故率', '', (b, c, r) => r.accRate],
  ['natWin', '全国勝率', '', b => b.natWin],
  ['locWin', '当地勝率', '', b => b.locWin],
];
// F情報(サイトから取れたときは nowF/hiddenF、取れなかったときは推定の now/hidden)
function fNow(r) { const f = (r && r.f) || {}; return f.nowF ?? f.now ?? 0; }
function fHid(r) { const f = (r && r.f) || {}; return f.hiddenF != null ? (f.hiddenF ? 1 : 0) : (f.hidden ? 1 : 0); }
const MET = Object.fromEntries(METRICS.map(m => [m[0], m]));
const srch = { conds: [{ w: 4, m: 'makuri', op: 'ge', v: 20 }], minN: 10, sort: 'post' };
try { const s = JSON.parse(localStorage.getItem('srch') || 'null'); if (s && Array.isArray(s.conds)) Object.assign(srch, s); } catch (e) {}
const saveSrch = () => { try { localStorage.setItem('srch', JSON.stringify(srch)); } catch (e) {} };
const showVal = (m, v) => v == null ? '-' : m[0] === 'fHid' ? (v ? 'あり' : 'なし') : m[2] === '回' ? `${v}回` : m[2] === '%' ? pct(v, 1) : m[2] === 's' ? fx(v, 2) : (Number.isInteger(v) ? v : fx(v, 2));

function searchRaces() {
  const hits = [];
  DATA.venues.forEach((v, vi) => v.races.forEach((rc, ri) => {
    const vals = [];
    for (const cd of srch.conds) {
      const m = MET[cd.m], b = rc.boats.find(x => x.waku === +cd.w);
      if (!m || !b || cd.v === '' || cd.v == null || isNaN(+cd.v)) return;
      const r = DATA.racers[b.reg] || {}, c = (r.c || [])[b.waku - 1];
      // 率・ST系は、そのコースの出走数が下限未満なら対象外
      const needN = m[0] !== 'n' && ['%', 's'].includes(m[2]) || ['str'].includes(m[0]);
      if (needN && (!c || c.n < srch.minN)) return;
      const x = m[3](b, c, r);
      if (x == null) return;
      const th = m[2] === '%' ? +cd.v / 100 : +cd.v;
      if (cd.op === 'ge' ? !(x >= th - 1e-9) : !(x <= th + 1e-9)) return;
      vals.push({ b, m, x });
    }
    hits.push({ vi, ri, v, rc, vals });
  }));
  if (srch.sort === 'post') hits.sort((a, b) => (a.rc.post || '').localeCompare(b.rc.post || ''));
  return hits;
}

function panelSearch() {
  const opts = (list, cur) => list.map(([k, lab]) => `<option value="${k}" ${String(k) === String(cur) ? 'selected' : ''}>${esc(lab)}</option>`).join('');
  const rows = srch.conds.map((cd, i) => {
    const m = MET[cd.m] || METRICS[0];
    return `<div class="cond" data-i="${i}">
      <select data-k="w" aria-label="艇">${opts([1, 2, 3, 4, 5, 6].map(k => [k, `${k}号艇（${k}コース）`]), cd.w)}</select>
      <select data-k="m" aria-label="指標">${opts(METRICS.map(x => [x[0], x[1]]), cd.m)}</select>
      <select data-k="op" aria-label="以上/以下">${opts([['ge', '以上'], ['le', '以下']], cd.op)}</select>
      <input data-k="v" type="number" step="any" inputmode="decimal" value="${esc(cd.v)}" aria-label="値">
      <span class="unit">${m[2] === '%' ? '%' : m[2] === 's' ? '秒' : m[2]}</span>
      <button class="del" data-act="del" title="この条件を消す">✕</button>
    </div>`;
  }).join('');
  const conds = srch.conds.filter(cd => MET[cd.m] && cd.v !== '' && !isNaN(+cd.v));
  const hits = conds.length ? searchRaces() : [];
  const body = hits.map(h => `<tr data-vi="${h.vi}" data-ri="${h.ri}">
      <td>${bellBtn(h.vi, h.ri)}</td><td>${esc(h.rc.post)}</td><td class="l"><b>${esc(h.v.name)} ${h.rc.rno}R</b></td><td class="l muted">${esc(h.rc.name)}</td>
      <td class="l">${h.vals.map(x => `<span class="hitv">${chip(x.b.waku, 1)} ${shortName(x.b.name)} ${esc(x.m[1].replace(/（.*）/, ''))} <b>${showVal(x.m, x.x)}</b></span>`).join('')}</td></tr>`).join('');
  return `<section class="card span-12">
    <h2>条件検索<small>${DATA.date} の全${DATA.venues.length}場から、すべての条件を満たすレースを探します</small></h2>
    ${rows || '<div class="muted">条件がありません。「＋ 条件を追加」を押してください。</div>'}
    <div class="srch-bar">
      <button data-act="add">＋ 条件を追加</button>
      <span class="srch-opt">率・STは、そのコースの出走数が <input data-k="minN" type="number" min="0" value="${srch.minN}"> 回以上の選手のみ</span>
      <span class="srch-opt">並び順 <select data-k="sort"><option value="post" ${srch.sort === 'post' ? 'selected' : ''}>締切順</option><option value="venue" ${srch.sort === 'venue' ? 'selected' : ''}>場・R順</option></select></span>
    </div>
    <div class="note">艇番は枠なり（4号艇＝4コース）として、その選手のそのコースでの成績で判定します（直近2年）。率は % で入力（例: 20 → 20%以上）。条件はこのブラウザに保存されます。</div>
  </section>
  <section class="card span-12">
    <div class="count">${conds.length ? `該当 ${hits.length} レース` : '条件を入れると結果が出ます'}</div>
    <div class="nt-wrap" style="margin:6px 0 8px">${ntBox()}</div>
    ${hits.length ? `<div class="scroll"><table class="results"><thead><tr><th title="押すと締切前に通知">通知</th><th>締切</th><th class="l">レース</th><th class="l">レース名</th><th class="l">条件の値</th></tr></thead><tbody>${body}</tbody></table></div>
      <div class="note">行を押すと、そのレースを Boat Board で開きます。</div>` : ''}
  </section>`;
}

// ---------- タイムライン(全レースを締切順に一気見) ----------
const tl = { venue: 'all', onlyHit: false, hideDone: false };
try { Object.assign(tl, JSON.parse(localStorage.getItem('tl') || '{}')); } catch (e) {}
const saveTl = () => { try { localStorage.setItem('tl', JSON.stringify(tl)); } catch (e) {} };

function raceStatus() {
  // 対象日が今日なら、今の時刻で 締切済/次 を判定する
  const now = new Date();
  const today = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
  const hm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  return post => DATA.date < today ? 'done' : DATA.date > today ? 'open' : ((post || '') < hm ? 'done' : 'open');
}

// ---------- 締切前のプッシュ通知(ntfy アプリへ予約送信) ----------
// 予約は ntfy.sh 側で保持されるので、ページやブラウザを閉じても届く。
// 予約のキーは「日付-場コード-R」。同じキーで送り直すと上書き、削除で取り消し。
const NTFY = 'https://ntfy.sh';
const nt = { topic: '', lead: 20, on: {}, open: false };
try { Object.assign(nt, JSON.parse(localStorage.getItem('ntfy') || '{}')); } catch (e) {}
const saveNt = () => { try { localStorage.setItem('ntfy', JSON.stringify(nt)); } catch (e) {} };
const newTopic = () => 'kyotei-' + Array.from(crypto.getRandomValues(new Uint8Array(9)), b => b.toString(16).padStart(2, '0')).join('');
if (!nt.topic) { nt.topic = newTopic(); saveNt(); }
(function pruneNt() {   // 過ぎた予約の記録は消す
  const now = Date.now(); let ch = false;
  for (const k in nt.on) if (nt.on[k].dl < now) { delete nt.on[k]; ch = true; }
  if (ch) saveNt();
})();
const ymd = DATA.date.replace(/\//g, '');
const ntKey = (v, rc) => `${ymd}-${v.code}-${rc.rno}`;
const deadline = rc => rc.post ? new Date(`${DATA.date.replace(/\//g, '-')}T${rc.post}:00+09:00`).getTime() : NaN;
const pageUrl = (v, rc) => location.href.split('#')[0] + `#${v.code}-${rc.rno}`;

async function ntPost(obj) {
  const r = await fetch(NTFY + '/', { method: 'POST', body: JSON.stringify({ topic: nt.topic, ...obj }) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
let ntMsg = '';
function ntToast(t) {
  ntMsg = t; const el = document.getElementById('ntMsg'); if (el) el.textContent = t;
}

async function toggleBell(btn) {
  const v = DATA.venues[+btn.dataset.vi], rc = v.races[+btn.dataset.ri], key = ntKey(v, rc);
  btn.disabled = true;
  try {
    if (nt.on[key]) {
      await fetch(`${NTFY}/${nt.topic}/${key}/delete`);
      delete nt.on[key]; saveNt();
      ntToast(`${v.name} ${rc.rno}R の通知を取り消しました。`);
    } else {
      const dl = deadline(rc), at = dl - nt.lead * 60000, now = Date.now();
      if (!(dl > now)) { ntToast('このレースは締切を過ぎています。'); return; }
      const names = rc.boats.map(b => `${'①②③④⑤⑥'[b.waku - 1]}${shortName(b.name)} ${b.cls}`).join(' ');
      const left = Math.round((dl - Math.max(at, now)) / 60000);
      const body = {
        title: `${v.name} ${rc.rno}R 締切${left}分前（${rc.post}）`,
        message: `${rc.name}\n${names}`,
        tags: ['boat'], priority: 4, sequence_id: key, click: pageUrl(v, rc),
      };
      if (at - now > 15000) body.delay = String(Math.floor(at / 1000));   // 15秒以内なら今すぐ送る
      await ntPost(body);
      nt.on[key] = { dl, at }; saveNt();
      ntToast(body.delay ? `${v.name} ${rc.rno}R を ${new Date(at).toTimeString().slice(0, 5)} に通知します。`
        : `${v.name} ${rc.rno}R は締切まで${left}分なので、今すぐ通知しました。`);
    }
  } catch (e) {
    ntToast('通知の予約に失敗しました。電波の状態を確認して、もう一度押してください。');
  } finally { render(); }
}

async function ntAction(a) {
  if (a === 'toggle') { nt.open = !nt.open; saveNt(); render(); return; }
  if (a === 'copy') {
    try { await navigator.clipboard.writeText(nt.topic); ntToast('トピック名をコピーしました。'); }
    catch (e) { ntToast('コピーできませんでした。表示されているトピック名を長押しでコピーしてください。'); }
    return;
  }
  if (a === 'test') {
    try { await ntPost({ title: 'テスト通知', message: 'Boat Boardからの通知が届くことを確認できました。', tags: ['white_check_mark'] });
      ntToast('テスト通知を送りました。数秒で ntfy アプリに届きます。'); }
    catch (e) { ntToast('送信に失敗しました。'); }
    return;
  }
  if (a === 'regen') {
    if (!confirm('トピック名を作り直します。予約済みの通知は取り消され、ntfy アプリでも登録し直しが必要です。よろしいですか？')) return;
    await Promise.all(Object.keys(nt.on).map(k => fetch(`${NTFY}/${nt.topic}/${k}/delete`).catch(() => {})));
    nt.on = {}; nt.topic = newTopic(); saveNt(); ntToast('新しいトピック名にしました。ntfy アプリで登録し直してください。'); render();
  }
}

function ntBox() {
  const cnt = Object.keys(nt.on).filter(k => k.startsWith(ymd)).length;
  const head = `<button class="iconbtn" data-nt="toggle" aria-expanded="${nt.open}">🔔 通知設定${cnt ? `（予約 ${cnt}）` : ''}</button>`;
  if (!nt.open) return head + `<span class="muted" id="ntMsg" style="font-size:12px">${esc(ntMsg)}</span>`;
  const leads = [5, 10, 15, 20, 30].map(m => `<option value="${m}" ${m === nt.lead ? 'selected' : ''}>${m}分前</option>`).join('');
  return head + `<div class="nt-box">
    <ol>
      <li>スマホに <b>ntfy</b> アプリを入れる（無料。iPhone は App Store、Android は Google Play で「ntfy」）</li>
      <li>アプリの「＋」で登録。トピック名に次を入れる（サーバーは ntfy.sh のまま）<br>
        <code class="nt-topic">${esc(nt.topic)}</code> <button class="iconbtn" data-nt="copy">コピー</button></li>
      <li><button class="iconbtn" data-nt="test">テスト通知を送る</button> で届くか確認</li>
      <li>各レースの <b>🔔</b> を押すと、締切の <select data-ntk="lead">${leads}</select> に通知が届きます（もう一度押すと取り消し）</li>
    </ol>
    <div class="muted" style="font-size:11px">通知は ntfy.sh から送られるので、このページを閉じていても届きます。トピック名を知っている人は通知の中身を見られるので、他人に教えないでください。
      通知の時刻は予約したときの設定で決まります。　<button class="linkbtn" data-nt="regen">トピック名を作り直す</button></div>
    <div id="ntMsg" class="nt-msg">${esc(ntMsg)}</div>
  </div>`;
}

// 通知ボタン(タイムライン・ダッシュボード・条件検索で共通)。締切を過ぎたレースは出さない
function bellBtn(vi, ri) {
  const v = DATA.venues[vi], rc = v.races[ri], on = !!nt.on[ntKey(v, rc)];
  if (!on && !(deadline(rc) > Date.now())) return '';
  return `<button class="bell${on ? ' on' : ''}" data-bell data-vi="${vi}" data-ri="${ri}" aria-pressed="${on}"
      title="${on ? '通知を取り消す' : `締切${nt.lead}分前に通知`}">${on ? '🔔' : '🔕'}</button>`;
}

function tlCard(item, status, isNext, isHit) {
  const { v, rc } = item;
  const bell = bellBtn(item.vi, item.ri);
  const b1 = rc.boats.find(b => b.waku === 1);
  const c1 = b1 && (DATA.racers[b1.reg]?.c || [])[0];
  const rows = rc.boats.map(b => {
    const r = DATA.racers[b.reg] || {}, c = (r.c || [])[b.waku - 1], f = r.f || {};
    const marks = [
      f.nowF ? `F${f.nowF}` : '', f.nowL ? `L${f.nowL}` : '', f.hiddenF ? '隠F' : '', f.hiddenL ? '隠L' : '',
      r.fg === 2 ? '前◎' : r.fg === 1 ? '前○' : '',
    ].filter(Boolean).map(t => `<span class="mk">${t}</span>`).join('');
    const stw = c && c.st != null ? Math.max(0, Math.min(1, (SLIT_MAX - c.st) / SLIT_MAX)) * 100 : 0;
    return `<tr><td>${chip(b.waku, 1)}</td><td class="nm">${shortName(b.name)}</td><td>${esc(b.cls)}</td>
      <td>${fx(b.midx, 1)}</td>${apCell(b)}
      <td style="white-space:nowrap"><span class="mslit"><i style="width:${stw}%;background:var(--b${b.waku})"></i></span> ${c && c.st != null ? fx(c.st, 2).replace(/^0/, '') : '-'}</td>
      <td>${c ? pct(c.w, 0) : '-'}</td><td>${c ? pct(c.t2, 0) : '-'}</td><td>${r.exRank ?? '-'}</td><td style="text-align:left">${marks}</td></tr>`;
  }).join('');
  return `<div class="tl${status === 'done' ? ' done' : ''}${isNext ? ' next' : ''}${isHit ? ' hit' : ''}" data-vi="${item.vi}" data-ri="${item.ri}">
    <div class="tl-h"><span class="tm">${esc(rc.post)}</span><span class="vr">${esc(v.name)} ${rc.rno}R</span>
      <span class="rn">${esc(rc.name)}</span>${isHit ? '<span class="star" title="条件検索の条件に合う">★</span>' : ''}
      <span class="in">イン逃げ <b>${c1 ? pct(c1.tech[0], 0) : '-'}</b></span>${bell}</div>
    <table><thead><tr><th></th><th class="l">選手</th><th>級</th><th>機力</th><th>AP</th><th>平均ST</th><th>1着</th><th>2連</th><th>展示R</th><th class="l">印</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function panelTimeline() {
  const status = raceStatus();
  const conds = srch.conds.filter(cd => MET[cd.m] && cd.v !== '' && !isNaN(+cd.v));
  const hitSet = new Set(conds.length ? searchRaces().map(h => `${h.vi}-${h.ri}`) : []);
  let items = [];
  DATA.venues.forEach((v, vi) => v.races.forEach((rc, ri) => items.push({ vi, ri, v, rc })));
  items.sort((a, b) => (a.rc.post || '').localeCompare(b.rc.post || '') || a.vi - b.vi);
  if (tl.venue !== 'all') items = items.filter(x => x.v.code === tl.venue);
  if (tl.onlyHit) items = items.filter(x => hitSet.has(`${x.vi}-${x.ri}`));
  if (tl.hideDone) items = items.filter(x => status(x.rc.post) !== 'done');
  const nextIdx = items.findIndex(x => status(x.rc.post) !== 'done');
  const venueOpts = [['all', '全場']].concat(DATA.venues.map(v => [v.code, v.name]))
    .map(([k, n]) => `<option value="${k}" ${k === tl.venue ? 'selected' : ''}>${esc(n)}</option>`).join('');
  return `<div class="tl-bar">
      <b>${DATA.date} タイムライン</b><span class="muted">${items.length} レース・締切順</span>
      <select data-tl="venue" aria-label="場で絞り込み">${venueOpts}</select>
      <label><input type="checkbox" data-tl="hideDone" ${tl.hideDone ? 'checked' : ''}> 締切済を隠す</label>
      <label><input type="checkbox" data-tl="onlyHit" ${tl.onlyHit ? 'checked' : ''} ${conds.length ? '' : 'disabled'}> ★（条件検索に合う）だけ</label>
      <span class="muted" style="font-size:11px">カードを押すと詳細へ。🔕を押すと締切前に通知。平均ST・1着・2連は枠なりのコースでの成績。印: F/L=今期、隠F、前◎○=前付け</span>
      <div class="nt-wrap">${ntBox()}</div>
    </div>
    <div class="tl-grid">${items.map((x, i) => tlCard(x, status(x.rc.post), i === nextIdx, hitSet.has(`${x.vi}-${x.ri}`))).join('') || '<div class="muted">該当するレースがありません。</div>'}</div>`;
}

    ['平均ST', 'そのコースでのスタートタイミングの平均。F（フライング）のレースは含めません。スリット表示は、点線がスタートライン（ST 0.00）で、早いほど右に伸びます。'],

    ['逃げ・逃がし時の2着傾向', '1号艇が1着のとき、2着がどの艇だったかの割合（その選手がそのコースにいたレース）。'],

function panelHelp() {
  return `<section class="card span-12 help">
    <h2>項目の説明<small>Boat Board の数字の意味と計算のしかた</small></h2>
    ${HELP.map(([sec, items]) => `<h3>${esc(sec)}</h3><dl>${items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`).join('')}
  </section>`;
}

function render() {
  renderNav();
  document.getElementById('searchBtn').setAttribute('aria-pressed', st.view === 'search');
  document.getElementById('tlBtn').setAttribute('aria-pressed', st.view === 'timeline');
  document.getElementById('helpBtn').setAttribute('aria-pressed', st.view === 'help');
  document.getElementById('tabs').style.display = st.view === 'race' ? '' : 'none';
  if (st.view === 'help') {
    document.getElementById('main').innerHTML = panelHelp();
    fitTop();
    return;
  }
  if (st.view === 'search') {
    document.getElementById('main').innerHTML = panelSearch();
    fitTop();
    return;
  }
  if (st.view === 'timeline') {
    document.getElementById('main').innerHTML = panelTimeline();
    fitTop();
    if (st.tlScroll) {   // タイムラインを開いたときだけ、次に締切のレースへ移動
      st.tlScroll = false;
      const nx = document.querySelector('.tl.next');
      if (nx) nx.scrollIntoView({ block: 'center' });
    }
    return;
  }
  const main = document.getElementById('main');
  main.innerHTML =
    T('entry', panelEntry()) + T('entry', panelTiles()) +
    T('place', panelPlace()) + T('place', panelTech()) + T('entry', panelFocus()) +
    T('st', panelST()) + T('st', panelSeriesST()) + T('st', panelSTRank()) +
    T('trend', panelSecond()) + T('trend', panelWinBy()) +
    T('trend', panelEx()) + T('series', panelSeries()) +
    T('combo', panelCombo()) +
    T('motor', panelMotor()) +
    `<div class="note span-12" style="grid-column:span 12">作成 ${DATA.built} ／ 集計期間 ${DATA.period}</div>`;
  main.querySelectorAll('[data-tab]').forEach(el => el.classList.toggle('on', el.dataset.tab === st.tab));
  fitTop();
  try { location.hash = `${venue().code}-${race().rno}`; } catch (e) {}
  try { localStorage.setItem('sn.lastRace', `${venue().code}-${race().rno}`); } catch (e) {}  // サイドバーで戻ってきたときに同じレースを開く
}

// ---------- イベント ----------
// 条件検索の操作
document.getElementById('main').addEventListener('change', e => {
  if (st.view !== 'search') return;
  const k = e.target.dataset.k; if (!k) return;
  const row = e.target.closest('.cond');
  if (row) {
    const cd = srch.conds[+row.dataset.i];
    cd[k] = k === 'w' ? +e.target.value : e.target.value;
  } else if (k === 'minN') srch.minN = Math.max(0, +e.target.value || 0);
  else if (k === 'sort') srch.sort = e.target.value;
  saveSrch(); render();
});
document.getElementById('main').addEventListener('click', e => {
  if (st.view !== 'search') return;
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'add') {
      const last = srch.conds[srch.conds.length - 1];
      srch.conds.push(last ? { ...last } : { w: 1, m: 'w', op: 'ge', v: 50 });
    } else if (act.dataset.act === 'del') {
      srch.conds.splice(+act.closest('.cond').dataset.i, 1);
    }
    saveSrch(); render(); return;
  }
  const tr = e.target.closest('table.results tbody tr');
  if (tr) { st.v = +tr.dataset.vi; st.r = +tr.dataset.ri; resetRace(); render(); window.scrollTo(0, 0); }
});
document.getElementById('main').addEventListener('change', e => {
  const s = e.target.closest('select.course'); if (!s) return;
  st.course[+s.dataset.w] = +s.value; render();
});
document.getElementById('main').addEventListener('click', e => {
  if (e.target.closest('select, a')) return;   // 選手名のリンクは競走成績へ(行の選択はしない)
  const tr = e.target.closest('table.entry tbody tr'); if (!tr) return;
  st.focus = +tr.dataset.w; render();
});
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t || !t.dataset.tip) { tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip; tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = e.clientY + 14 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

// 初期表示: URLの #場コード-R を復元
(function init() {
  const m = (location.hash || '').match(/^#([A-Z]{3})-(\d+)$/);
  if (m) {
    const vi = DATA.venues.findIndex(v => v.code === m[1]);
    if (vi >= 0) { st.v = vi; const ri = DATA.venues[vi].races.findIndex(r => r.rno === +m[2]); if (ri >= 0) st.r = ri; }
  }
  render();
})();
</script>
