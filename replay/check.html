<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>リプレイ確認</title>
<style>
  body { margin:0; background:#0f1620; color:#e8eef5; font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; padding:12px; }
  h1 { font-size:16px; margin:0 0 10px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  input, select, button { font:inherit; font-size:15px; color:#e8eef5; background:#18222f; border:1px solid #2a3a4d; border-radius:6px; padding:7px 9px; }
  button { cursor:pointer; }
  #go { background:#3fa7ff; border-color:#3fa7ff; color:#fff; }
  h2 { font-size:14px; color:#93a4b8; margin:16px 0 6px; }
  .url { word-break:break-all; font-size:12px; background:#18222f; border:1px solid #2a3a4d; border-radius:6px; padding:8px; margin-bottom:6px; }
  .url button { margin-top:6px; font-size:13px; padding:5px 8px; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:11px; background:#05090e; border:1px solid #2a3a4d; border-radius:6px; padding:8px; max-height:50vh; overflow:auto; }
  video { width:100%; background:#000; border-radius:6px; }
  #seek { display:none; }
  #msg { font-size:13px; color:#ffcf5c; line-height:1.6; }
  .ok { color:#5cd68a; } .ng { color:#ff6b6b; }
</style>
</head>
<body>
<h1>リプレイ確認（動画URLが取れるか調べる）</h1>
<div class="row">
  <input type="date" id="date">
  <select id="jo"></select>
  <select id="type"><option value="exhibition">展示</option><option value="race">レース</option></select>
  <select id="race"></select>
  <button id="go">調べる</button>
  <button id="probe">プレーヤーの仕組みを調べる</button>
  <button id="copy">結果を全部コピー</button>
</div>
<div id="msg"></div>

<h2>見つかった動画らしきURL</h2>
<div id="urls">（まだ調べていません）</div>

<h2>試し再生</h2>
<video id="v" controls playsinline></video>
<div class="row" id="seek">
  <button data-s="-5">−5秒</button><button data-s="-1">−1秒</button><button data-s="-0.033">−1コマ</button>
  <button data-s="0.033">＋1コマ</button><button data-s="1">＋1秒</button><button data-s="5">＋5秒</button>
  <button id="toSec">秒数を指定</button>
  <span id="now" style="align-self:center;font-size:14px"></span>
</div>

<h2>プレーヤーの仕組み</h2>
<pre id="probe-out">—</pre>
<h2>setting.json の中身（このレースの部分）</h2>
<pre id="race-json">—</pre>
<h2>setting.json の中身（全体）</h2>
<pre id="all-json">—</pre>

<script>
const PLAYER = "https://front.player.boatrace-cdn.jp";
const SVC = ['boat', 'cast'].join('');
const JO = [
  ["01","kiryu","桐生"],["02","toda","戸田"],["03","edogawa","江戸川"],["04","heiwajima","平和島"],
  ["05","tamagawa","多摩川"],["06","hamanako","浜名湖"],["07","gamagori","蒲郡"],["08","tokoname","常滑"],
  ["09","tsu","津"],["10","mikuni","三国"],["11","biwako","びわこ"],["12","suminoe","住之江"],
  ["13","amagasaki","尼崎"],["14","naruto","鳴門"],["15","marugame","丸亀"],["16","kojima","児島"],
  ["17","miyajima","宮島"],["18","tokuyama","徳山"],["19","shimonoseki","下関"],["20","wakamatsu","若松"],
  ["21","ashiya","芦屋"],["22","fukuoka","福岡"],["23","karatsu","唐津"],["24","omura","大村"],
].map(([code, slug, name]) => ({code, slug, name}));
const $ = id => document.getElementById(id);
const msg = (t, cls) => { const p = document.createElement("div"); if (cls) p.className = cls; p.textContent = t; $("msg").appendChild(p); };

JO.forEach(j => $("jo").add(new Option(j.name, j.code)));
for (let r = 1; r <= 12; r++) $("race").add(new Option(r + "R", r));
$("race").value = 12;
const d = new Date(); d.setDate(d.getDate() - 1);
$("date").value = d.toISOString().slice(0, 10);

// JSON の中から動画らしき文字列を全部拾う
function findUrls(obj, base, out = new Set()) {
  if (typeof obj === "string") {
    if (/\.(m3u8|mp4|mpd|ts)(\?|$)/i.test(obj) || /^https?:\/\//i.test(obj)) {
      try { out.add(new URL(obj, base).href); } catch (e) { out.add(obj); }
    }
  } else if (obj && typeof obj === "object") {
    Object.values(obj).forEach(v => findUrls(v, base, out));
  }
  return out;
}

let hls = null;
async function play(url) {
  const v = $("v");
  if (hls) { hls.destroy(); hls = null; }
  msg("再生を試しています: " + url);
  try {
    const r = await fetch(url);
    msg(`動画URLの読み込み: ${r.status} ${r.ok ? "OK" : "失敗"}`, r.ok ? "ok" : "ng");
    if (r.ok && /m3u8/i.test(url)) {
      const text = await r.text();
      if (/EXT-X-KEY/.test(text)) msg("※ 暗号化の指定（EXT-X-KEY）があります。再生できない可能性があります", "ng");
    }
  } catch (e) {
    msg("動画URLを読み込めませんでした（CORSで止められた可能性）: " + e.message, "ng");
  }
  const isHls = /m3u8/i.test(url);
  if (!isHls || v.canPlayType("application/vnd.apple.mpegurl")) {
    v.src = url;
  } else {
    if (!window.Hls) {
      await new Promise((ok, ng) => { const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/hls.js@1"; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
    }
    hls = new Hls(); hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, e) => { if (e.fatal) msg("hls.js エラー: " + e.details, "ng"); });
  }
  v.onloadedmetadata = () => { msg(`再生できました（長さ ${v.duration.toFixed(1)}秒）。下のボタンで再生位置を動かせるか試してください`, "ok"); $("seek").style.display = "flex"; };
  v.onerror = () => msg("video の再生エラー: " + (v.error && v.error.code), "ng");
  v.play().catch(() => {});
}

document.querySelectorAll("#seek [data-s]").forEach(b => b.onclick = () => {
  const v = $("v"); v.pause(); v.currentTime = Math.max(0, v.currentTime + +b.dataset.s);
});
$("toSec").onclick = () => { const s = prompt("何秒の位置に飛びますか？", "30"); if (s !== null) $("v").currentTime = +s; };
$("v").ontimeupdate = () => { $("now").textContent = $("v").currentTime.toFixed(2) + "秒"; };

// プレーヤーのHTMLとJSを読んで、動画URLの作り方が書かれていそうな部分を抜き出す
$("probe").onclick = async () => {
  const out = $("probe-out"); out.textContent = "";
  const log = t => { out.textContent += t + "\n"; };
  const j = JO.find(x => x.code === $("jo").value);
  const day = $("date").value.replaceAll("-", "");
  const pUrl = `${PLAYER}/player/vod?service=${SVC}&stadium=${j.code}${j.slug}&raceType=${$("type").value}`
             + `&raceDate=${day}&raceNumber=${$("race").value}&autoplay=0&bitrate=low`;
  log("PLAYER: " + pUrl);
  let html;
  try {
    const r = await fetch(pUrl);
    log(`player html: ${r.status}`);
    html = await r.text();
  } catch (e) { log("player html 読み込み失敗: " + e.message); return; }
  log("--- HTML先頭 ---\n" + html.slice(0, 1500));
  const srcs = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m => new URL(m[1], pUrl).href);
  const inline = [...html.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
  log("--- script src ---\n" + srcs.join("\n"));
  const KEYS = /m3u8|\.mp4|\.mpd|ref_id|source_type|refId|manifest|playlist|hls|streaming|\/vod\/|api\/|https?:\/\/[a-z0-9.-]+/gi;
  const scan = (name, text) => {
    log(`\n=== ${name}（${text.length}文字）===`);
    const seen = new Set(); let n = 0;
    for (const m of text.matchAll(KEYS)) {
      const s = Math.max(0, m.index - 120), e = Math.min(text.length, m.index + 160);
      const key = Math.floor(s / 200);
      if (seen.has(key)) continue; seen.add(key);
      log("…" + text.slice(s, e).replace(/\s+/g, " ") + "…");
      if (++n >= 40) { log("（多いので40件で打ち切り）"); break; }
    }
    if (!n) log("（該当なし）");
  };
  inline.forEach((t, i) => t.trim() && scan("inline script " + i, t));
  for (const s of srcs) {
    if (/streaksplayer\.min\.js/.test(s)) { log(`\n=== ${s}（プレーヤー本体なので省略）`); continue; }
    try { const r = await fetch(s); const t = await r.text();
      log(`\n=== ${s}（${t.length}文字・全文）===\n` + t.slice(0, 15000) + (t.length > 15000 ? "\n（15000文字で打ち切り）" : "")); }
    catch (e) { log(`\n=== ${s} 読み込み失敗: ${e.message}`); }
  }
  log("\n（おわり）");
};
$("copy").onclick = async () => {
  const t = ["msg", "probe-out", "race-json", "all-json"].map(id => `#${id}\n` + $(id).innerText).join("\n\n");
  try { await navigator.clipboard.writeText(t); alert("コピーしました。チャットに貼り付けてください"); }
  catch (e) { prompt("自動コピーできなかったので、これを全選択してコピーしてください", t.slice(0, 20000)); }
};

$("go").onclick = async () => {
  $("msg").innerHTML = ""; $("urls").innerHTML = ""; $("seek").style.display = "none";
  const j = JO.find(x => x.code === $("jo").value);
  const day = $("date").value.replaceAll("-", "");
  const type = $("type").value;
  const url = `${PLAYER}/setting/vod/${day}/${j.code}${j.slug}/${type}/setting.json?t=${Date.now()/1000|0}`;
  msg("setting.json を読み込み中: " + url);
  let js;
  try {
    const r = await fetch(url);
    if (!r.ok) { msg(`読み込めませんでした（${r.status}）。その日・その場に開催がないかもしれません`, "ng"); return; }
    js = await r.json();
  } catch (e) { msg("読み込みエラー: " + e.message, "ng"); return; }
  msg("setting.json を読み込めました", "ok");
  $("all-json").textContent = JSON.stringify(js, null, 2);

  const races = js.races || {};
  const key = Object.keys(races).find(k => +k === +$("race").value);
  const part = key ? races[key] : null;
  $("race-json").textContent = part ? JSON.stringify(part, null, 2) : "このレースの項目が見つかりません（races の中身: " + Object.keys(races).join(", ") + "）";

  const found = [...findUrls(part || js, url)];
  if (!found.length) {
    $("urls").textContent = "動画URLらしきものは見つかりませんでした。下の中身をスクショして送ってください。";
    return;
  }
  found.forEach(u => {
    const box = document.createElement("div"); box.className = "url"; box.textContent = u;
    const b = document.createElement("button"); b.textContent = "これを再生してみる"; b.onclick = () => play(u);
    box.appendChild(document.createElement("br")); box.appendChild(b);
    $("urls").appendChild(box);
  });
};
</script>
</body>
</html>
