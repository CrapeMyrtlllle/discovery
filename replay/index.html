<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>リプレイ一気見</title>
<style>
  :root { --bg:#0f1620; --panel:#18222f; --line:#2a3a4d; --text:#e8eef5; --sub:#93a4b8; --accent:#3fa7ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  h1 { font-size:17px; margin:0 8px 0 0; }
  label { font-size:13px; color:var(--sub); display:flex; align-items:center; gap:6px; }
  input, select, button { font:inherit; font-size:14px; color:var(--text); background:#0f1620; border:1px solid var(--line);
                          border-radius:6px; padding:5px 8px; }
  button { cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #status { font-size:13px; color:var(--sub); }
  main { padding:14px 16px 40px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(min(var(--w,420px), 100%), 1fr)); }
  .nav { display:flex; gap:8px; margin-top:8px; }
  .nav button { flex:1; padding:10px; font-size:15px; }
  .nav button:disabled { opacity:.35; cursor:default; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .card h2 { font-size:14px; margin:0; padding:7px 10px; display:flex; justify-content:space-between; align-items:center; }
  .card h2 a { color:var(--sub); font-size:12px; font-weight:normal; text-decoration:none; }
  .frame { position:relative; aspect-ratio:16/9; background:#000; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .frame .load { position:absolute; inset:0; width:100%; height:100%; border:0; border-radius:0; background:#05090e;
                 color:var(--sub); font-size:15px; }
  .frame .load:hover { color:var(--text); }
  /* 1画面モード */
  .single { display:grid; grid-template-columns:1fr 200px; gap:12px; }
  .single .list { display:flex; flex-direction:column; gap:4px; max-height:80vh; overflow:auto; }
  .single .list button { text-align:left; }
  .single .big .frame { max-height:80vh; }
  .note { font-size:12px; color:var(--sub); margin-top:18px; line-height:1.7; }
  @media (max-width:700px){
    .single { grid-template-columns:1fr; } .single .list { flex-direction:row; flex-wrap:wrap; }
    header { position:static; padding:8px 12px; gap:8px 10px; } h1 { font-size:15px; width:100%; }
    main { padding:10px 10px 30px; } #sizeL { display:none; }
  }
</style>
</head>
<body>
<header>
  <h1>リプレイ一気見</h1>
  <label>日付 <input type="date" id="date"></label>
  <label>見方 <select id="by"><option value="jo">場ごと</option><option value="race">全場で同じレース</option></select></label>
  <label id="joL">場 <select id="jo"></select></label>
  <label id="raceL">レース <select id="race"></select></label>
  <label>種類 <select id="type"><option value="race">レース</option><option value="exhibition">展示</option></select></label>
  <label>表示
    <button id="mGrid">並べる</button><button id="mSingle">1画面で順に</button>
  </label>
  <label id="sizeL">大きさ <select id="size"><option value="320px">小</option><option value="420px" selected>中</option><option value="600px">大</option></select></label>
  <span id="status"></span>
</header>
<main>
  <div id="view"></div>
  <p class="note">映像は BOATCAST（公式ボートレースWeb映像サービス）のプレーヤーをそのまま表示しています。
    開催場・レースは BOATCAST のリプレイ一覧で確かめています。「並べる」ではプレーヤーは押したものから読み込みます（一度に全部読み込むと重くなるため）。
    1画面モードでは「前へ」「次へ」のボタン（パソコンでは ← → キー）で移れます。</p>
</main>
<script>
const PLAYER = "https://front.player.boatrace-cdn.jp";
const JO = [
  ["01","kiryu","桐生"],["02","toda","戸田"],["03","edogawa","江戸川"],["04","heiwajima","平和島"],
  ["05","tamagawa","多摩川"],["06","hamanako","浜名湖"],["07","gamagori","蒲郡"],["08","tokoname","常滑"],
  ["09","tsu","津"],["10","mikuni","三国"],["11","biwako","びわこ"],["12","suminoe","住之江"],
  ["13","amagasaki","尼崎"],["14","naruto","鳴門"],["15","marugame","丸亀"],["16","kojima","児島"],
  ["17","miyajima","宮島"],["18","tokuyama","徳山"],["19","shimonoseki","下関"],["20","wakamatsu","若松"],
  ["21","ashiya","芦屋"],["22","fukuoka","福岡"],["23","karatsu","唐津"],["24","omura","大村"],
].map(([code, slug, name]) => ({code, slug, name}));
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
let mode = q.get("mode") === "grid" ? "grid" : "single";
let days = {};      // 場コード → その日のレース番号の一覧（["01",...]）
let items = [];     // 見る順の一覧 [{j, r}]
let cur = 0;        // 1画面モードの位置

for (let r = 1; r <= 12; r++) $("race").add(new Option(r + "R", r));
$("race").value = q.get("r") || 12;
$("type").value = q.get("t") === "exhibition" ? "exhibition" : "race";
$("by").value = q.get("by") === "race" ? "race" : "jo";

function ymd(d){ return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0"); }
function toInput(s){ return s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8); }
function dateStr(){ return $("date").value.replaceAll("-",""); }

function playerUrl(it, auto){
  return `${PLAYER}/player/vod?service=boatcast&stadium=${it.j.code}${it.j.slug}&raceType=${$("type").value}`
       + `&raceDate=${dateStr()}&raceNumber=${it.r}&autoplay=${auto?1:0}&bitrate=low`;
}
function bcUrl(it){
  return `https://race.boatcast.jp/replay?jo=${it.j.code}&ymd=${dateStr()}&race=${it.r}` + ($("type").value==="exhibition"?"&md=T":"");
}

// その日にリプレイがある場と、そのレース番号を調べる
async function findDay(day, type){
  const out = {};
  await Promise.all(JO.map(async j => {
    try {
      const resp = await fetch(`${PLAYER}/setting/vod/${day}/${j.code}${j.slug}/${type}/setting.json?t=${Date.now()/1000|0}`);
      if (!resp.ok) return;
      const js = await resp.json();
      const rs = Object.keys(js.races || {}).sort();
      if (rs.length) out[j.code] = rs;
    } catch(e){}
  }));
  return out;
}

function buildItems(){
  if ($("by").value === "jo") {
    const j = JO.find(x => x.code === $("jo").value);
    items = j && days[j.code] ? days[j.code].map(r => ({j, r: +r})) : [];
  } else {
    const r = String($("race").value).padStart(2,"0");
    items = JO.filter(j => days[j.code] && days[j.code].includes(r)).map(j => ({j, r: +r}));
  }
}
function label(it){ return $("by").value === "jo" ? `${it.r}R` : it.j.name; }

const ALLOW = "autoplay; encrypted-media; picture-in-picture; fullscreen";
function frame(it, auto){
  const f = document.createElement("div"); f.className = "frame";
  const put = () => { f.innerHTML = `<iframe src="${playerUrl(it, true)}" allow="${ALLOW}" allowfullscreen></iframe>`; };
  if (auto) put();
  else { const b = document.createElement("button"); b.className = "load"; b.textContent = "▶ 読み込む"; b.onclick = put; f.appendChild(b); }
  return f;
}
function card(it, auto){
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `<h2><span>${it.j.name} ${it.r}R</span><a href="${bcUrl(it)}" target="_blank" rel="noopener">BOATCASTで開く</a></h2>`;
  c.appendChild(frame(it, auto));
  return c;
}

function saveUrl(){
  const p = new URLSearchParams({d: dateStr(), by: $("by").value, t: $("type").value, mode});
  if ($("by").value === "jo") p.set("jo", $("jo").value); else p.set("r", $("race").value);
  if (mode === "single" && cur) p.set("i", cur);
  history.replaceState(null, "", "?" + p);
}

function render(){
  const byJo = $("by").value === "jo";
  $("joL").style.display = byJo ? "" : "none";
  $("raceL").style.display = byJo ? "none" : "";
  $("mGrid").classList.toggle("on", mode==="grid"); $("mSingle").classList.toggle("on", mode==="single");
  const v = $("view"); v.innerHTML = ""; v.className = "";
  if (!items.length) { $("status").textContent = ""; v.textContent = "この日・この条件のリプレイは見つかりませんでした。"; saveUrl(); return; }
  if (mode === "grid") {
    v.className = "grid"; v.style.setProperty("--w", $("size").value);
    items.forEach(it => v.appendChild(card(it, false)));
    const all = document.createElement("button"); all.textContent = "全部読み込む";
    all.onclick = () => v.querySelectorAll(".load").forEach(b => b.click());
    $("status").replaceChildren(`${items.length}${byJo ? "レース" : "場"} `, all);
  } else {
    v.className = "single";
    cur = Math.max(0, Math.min(cur, items.length-1));
    const big = document.createElement("div"); big.className = "big"; big.appendChild(card(items[cur], true));
    const nav = document.createElement("div"); nav.className = "nav";
    const unit = byJo ? "レース" : "場";
    const prev = document.createElement("button"); prev.textContent = `◀ 前の${unit}`; prev.disabled = cur === 0;
    const next = document.createElement("button"); next.textContent = `次の${unit} ▶`; next.disabled = cur === items.length-1;
    prev.onclick = () => { cur--; render(); }; next.onclick = () => { cur++; render(); };
    nav.append(prev, next); big.appendChild(nav);
    const list = document.createElement("div"); list.className = "list";
    items.forEach((it,i) => {
      const b = document.createElement("button"); b.textContent = label(it);
      if (i===cur) b.classList.add("on");
      b.onclick = () => { cur = i; render(); };
      list.appendChild(b);
    });
    v.append(big, list);
    $("status").textContent = `${cur+1} / ${items.length}${unit}`;
  }
  saveUrl();
}

function fillJo(want){
  const held = JO.filter(j => days[j.code]);
  $("jo").innerHTML = "";
  held.forEach(j => $("jo").add(new Option(j.name, j.code)));
  if (held.some(j => j.code === want)) $("jo").value = want;
}

async function load(keepCur){
  $("status").textContent = "開催場を確かめています…";
  days = await findDay(dateStr(), $("type").value);
  fillJo($("jo").value || q.get("jo"));
  buildItems();
  if (!keepCur) cur = 0;
  render();
}

document.addEventListener("keydown", e => {
  if (mode !== "single" || !items.length || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight" && cur < items.length-1) { cur++; render(); }
  if (e.key === "ArrowLeft" && cur > 0) { cur--; render(); }
});
$("mGrid").onclick = () => { mode = "grid"; render(); };
$("mSingle").onclick = () => { mode = "single"; render(); };
$("size").onchange = render;
["by","jo","race"].forEach(id => $(id).onchange = () => { buildItems(); cur = 0; render(); });
["date","type"].forEach(id => $(id).onchange = () => load(false));

(async () => {
  cur = +(q.get("i") || 0);
  if (q.get("d")) { $("date").value = toInput(q.get("d")); await load(true); return; }
  // 指定がなければ今日。今日のリプレイがまだなければ前の日にさかのぼる
  const d = new Date();
  for (let i = 0; i < 4; i++) {
    $("date").value = toInput(ymd(d));
    await load(true);
    if (Object.keys(days).length) return;
    d.setDate(d.getDate()-1);
  }
})();
</script>
</body>
</html>
