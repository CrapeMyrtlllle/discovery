<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Boat Board</title>
<style>
:root { color-scheme: light; --page:#eef3f8; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ring:rgba(11,11,11,.12); --accent:#2a78d6; --bad:#d03b3b; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ring:rgba(255,255,255,.12); --accent:#3987e5; --bad:#e66767; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--page); color:var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; padding:16px; }
form { width:100%; max-width:360px; background:var(--surface); border:1px solid var(--ring); border-radius:12px; padding:24px 20px; }
h1 { font-size:18px; margin:0 0 6px; }
p { color:var(--ink2); font-size:13px; margin:0 0 16px; line-height:1.6; }
input[type=password] { width:100%; font-size:16px; padding:10px 12px; border:1px solid var(--ring); border-radius:8px; background:var(--page); color:var(--ink); }
label { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--ink2); margin:10px 0 14px; }
button { width:100%; font-size:15px; font-weight:700; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
#msg { min-height:20px; font-size:13px; color:var(--bad); margin-top:10px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Boat Board</h1>
  <p>このページは会員限定です。パスワードを入力してください。<br><a href="../about/" style="color:var(--accent);font-weight:700">パスワードをお持ちでない方はこちら（無料サンプルあり）→</a></p>
  <input id="pw" type="password" placeholder="パスワード" aria-label="パスワード" autofocus>
  <label><input id="keep" type="checkbox" checked> このパスワードを記憶する</label>
  <button id="go" type="submit">開く</button>
  <div id="msg" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.s), iterations: ENC.n, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.i) }, key, b64(ENC.c));
  const html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), go = document.getElementById('go'), msg = document.getElementById('msg');
async function tryOpen(pw, remember) {
  go.disabled = true; msg.textContent = '';
  try {
    await open_(pw);
    try { remember ? localStorage.setItem('dpw', pw) : localStorage.removeItem('dpw'); } catch (e) {}
  } catch (e) {
    try { localStorage.removeItem('dpw'); } catch (e2) {}
    go.disabled = false;
    msg.textContent = (window.crypto && crypto.subtle && window.DecompressionStream)
      ? 'パスワードが違います（毎月変わります）。' : 'このブラウザでは開けません。最新のブラウザでお試しください。';
  }
}
f.addEventListener('submit', e => { e.preventDefault(); tryOpen(document.getElementById('pw').value.trim(), document.getElementById('keep').checked); });
try { const saved = localStorage.getItem('dpw'); if (saved) tryOpen(saved, true); } catch (e) {}
